<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07060d">
<title>Sem internet — Fiz Música</title>
<style>
  html, body { margin: 0; height: 100%; background: #07060d; color: #fff; font-family: system-ui, -apple-system, sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
  img { width: 88px; height: 88px; margin-bottom: 24px; }
  h1 { font-size: 22px; margin: 0 0 10px; }
  p { font-size: 16px; line-height: 1.5; color: rgba(255,255,255,.8); margin: 0 0 28px; max-width: 300px; }
  button { font-size: 16px; font-weight: 600; color: #fff; background: #f0196b; border: 0; border-radius: 14px; padding: 14px 28px; }
</style>
</head>
<body>
<main>
  <img src="/app/icon-192.png" alt="">
  <h1>Sem conexão com a internet</h1>
  <p>Confira o Wi-Fi ou os dados móveis do celular e tente de novo. Suas músicas continuam guardadas.</p>
  <button onclick="location.reload()">Tentar de novo</button>
</main>
</body>
</html>
